[workspace]

[package]
name = "open-easy-web-server"
description = "open-easy-web: フォルダー作成・アップロード・AI自動PHP判定・nginx+PHP-FPM自動構成を担うバックエンド(WASM UIとは別バイナリ)。重量級Webフレームワークは使わずtokio/hyperを直接使用する。"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"

[[bin]]
name = "open-easy-web-server"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
base32 = "0.5"
rand = "0.8"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "rustls-tls"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
thiserror = "1"
# 分散同期(dist_sync.rs)向け: open-raid-zの切断耐性ジャーナル/オフサイト
# 退避/ディザスタリカバリ/CPU圧縮を再現実装せず再利用する(ユーザー指示、
# CLAUDE.md参照)。`aruaru-dist`のpath依存パターン(`default-features =
# false`でWinFsp/dxc/Windows SDK不要のCPUフォールバックのみ使う)を踏襲。
open_raid_z_core = { path = "../../open-raid-z/open_runo_zfs_source/open_raid_z_core", default-features = false, features = ["offsite_backup"] }
uuid = { version = "1", features = ["v4", "serde"] }
# 深夜自動アップデート(auto_update.rs)向け: リリースアセット(tar.gz/zip)
# の展開、およびLinuxでのSO_REUSEPORTを使ったほぼゼロダウンタイム切り替え。
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
socket2 = { version = "0.5", features = ["all"] }
# DATABASE暗号化(db_encryption.rs)向け: AES-256-GCM。ハードウェア
# アクセラレーション(AES-NI)が利用可能な環境では高速に動作する標準的な
# AEAD暗号(ランダムnonceを毎回生成)。既存のTOTP等と同じくRustCryptoの
# 実績ある実装を採用し、自前実装はしない。
aes-gcm = "0.10"
# メモリ使用状況表示(2026-07-31追加): クロスプラットフォーム
# (Windows/Linux/macOS)でシステムの総メモリ・使用中メモリを取得する
# 実績あるクレート。自前でプラットフォーム別API(GlobalMemoryStatusEx/
# /proc/meminfo)を書き分けない。
sysinfo = "0.32"

[dev-dependencies]
reqwest = { version = "0.12", features = ["json", "multipart"] }
tempfile = "3"
mockito = "1"
# dist_syncの実複製テスト(インプロセスrussh SFTPサーバー)向け。
# open_raid_z_core側`tests/offsite_backup_integration.rs`と同じ
# バージョン・featureに揃える(実クラウド/実VPSには一切接続しない、
# ローカルモックのみの既存検証方針を踏襲)。
russh = { version = "0.62", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "2"
# `rand`は主依存(`rand = "0.8"`、認証OTP生成等で使用)とメジャー
# バージョンが異なる(russh 0.62のキー生成が要求するのは0.10系)ため、
# 名前衝突を避けて`rand_for_test_keys`としてリネームして依存させる。
rand_for_test_keys = { package = "rand", version = "0.10" }
